<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 250px; font-family: sans-serif; padding: 12px; margin: 0; background: #f9f9f9; color: #333; }
    h3 { margin: 0 0 12px 0; font-size: 14px; text-align: center; color: #10a37f; }
    .switch-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #eee; }
    .label { font-size: 12px; font-weight: bold; }
    .btn-toggle { background: #10a37f; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; width: 45px; text-align: center; }
    .btn-toggle.off { background: #d9534f; }
    
    /* Стили для радиокнопок режима списка */
    .mode-box { display: flex; gap: 12px; margin: 10px 0 6px 0; font-size: 12px; font-weight: bold; color: #666; }
    .mode-label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    
    textarea { width: 100%; height: 60px; font-size: 11px; box-sizing: border-box; resize: none; border: 1px solid #ccc; border-radius: 4px; padding: 6px; }
    textarea::placeholder { color: #b9b9b9; opacity: 1; }
    .footer { font-size: 10px; text-align: center; color: #999; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>🔗 AI Link Fixer Pro</h3>
  
  <div class="switch-box">
    <span class="label">Кнопка «Склеить URL»:</span>
    <button id="fixBtnState" class="btn-toggle">ВКЛ</button>
  </div>

  <div class="switch-box">
    <span class="label">Кнопка «Копировать»:</span>
    <button id="copyBtnState" class="btn-toggle">ВКЛ</button>
  </div>

  <!-- Радиокнопки переключения режима фильтрации -->
  <div class="mode-box">
    <label class="mode-label">
      <input type="radio" name="filterMode" value="blacklist" checked> Черный список
    </label>
    <label class="mode-label">
      <input type="radio" name="filterMode" value="whitelist"> Белый список
    </label>
  </div>
  
  <textarea id="sitesList" placeholder="example.com&#10;youtube.com"></textarea>

  <div class="footer">Настройки сохраняются автоматически</div>

  <script src="popup.js"></script>
</body>
</html>
